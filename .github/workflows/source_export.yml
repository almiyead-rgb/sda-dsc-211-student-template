name: Source Export
on:
  push:
    branches: [bilingual-side-by-side-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package learner-facing source
        run: |
          mkdir -p source-export
          cp -R notebooks source-export/
          cp -R presentation source-export/
          cp -R reports source-export/
          cp -R resources source-export/
          cp -R scripts source-export/
          cp -R tests source-export/
          cp -R tamweel source-export/
          cp -R data source-export/
          cp *.md source-export/ 2>/dev/null || true
          cp *.txt source-export/ 2>/dev/null || true
          cp .gitignore source-export/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: bilingual-source-export
          path: source-export
          retention-days: 1
