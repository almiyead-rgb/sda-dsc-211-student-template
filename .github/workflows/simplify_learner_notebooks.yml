name: Simplify learner notebook instructions

on:
  push:
    branches:
      - student-flow/single-question-notebooks
    paths:
      - scripts/simplify_learner_notebooks.py
      - notebooks/*.ipynb
      - .github/workflows/simplify_learner_notebooks.yml

permissions:
  contents: write

concurrency:
  group: simplify-learner-notebooks
  cancel-in-progress: false

jobs:
  simplify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: student-flow/single-question-notebooks
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Rebuild learner-facing notebook instructions
        run: python scripts/simplify_learner_notebooks.py
      - name: Verify notebook JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('notebooks').glob('0[1-5]_*.ipynb')):
              json.loads(path.read_text(encoding='utf-8'))
              print(path)
          PY
      - name: Commit generated notebooks
        run: |
          if git diff --quiet -- notebooks; then
            echo 'No notebook changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooks
          git commit -m 'Align Colab notebooks with the one-question daily workflow'
          git push origin HEAD:student-flow/single-question-notebooks
