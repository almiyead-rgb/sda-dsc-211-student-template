schema_version: 1
release_target: v1.1.0
mode: phased

markdown_files:
  - path: README.md
    status: planned
    required_markers:
      - '<!-- BILINGUAL:EN -->'
      - '<!-- BILINGUAL:AR -->'
  - path: GLOSSARY.md
    status: planned
    required_markers:
      - '<!-- BILINGUAL:EN -->'
      - '<!-- BILINGUAL:AR -->'
  - path: docs/BILINGUAL_NOTEBOOK_STANDARD.md
    status: complete
    required_markers:
      - 'English'
      - 'العربية'

notebooks:
  - path: notebooks/00_readiness_check.ipynb
    status: planned
    minimum_paired_cells: 4
  - path: notebooks/01_baseline_boosting.ipynb
    status: planned
    minimum_paired_cells: 8
  - path: notebooks/02_validation_tuning.ipynb
    status: planned
    minimum_paired_cells: 8
  - path: notebooks/03_cost_sensitive_decision.ipynb
    status: planned
    minimum_paired_cells: 8
  - path: notebooks/04_explain_calibrate.ipynb
    status: planned
    minimum_paired_cells: 8
  - path: notebooks/05_final_model.ipynb
    status: planned
    minimum_paired_cells: 8
  - path: notebooks/99_final_submission_check.ipynb
    status: planned
    minimum_paired_cells: 5

rules:
  enforce_only_complete_items: true
  notebook_pair_metadata_key: bilingual_pair_id
  notebook_order_metadata_key: bilingual_order
  required_notebook_order: en-left-ar-right
  required_english_signal: English
  required_arabic_signal: العربية
